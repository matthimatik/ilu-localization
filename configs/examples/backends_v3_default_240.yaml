pipeline: backends-example
stages:
  - name: load_image
    impl: load_image
    cfg:
      image: ../ilu-pose-estimation/datasets/synthetic-data-generation/v3_default_240/rgb.jpg
      camera:
        intrinsics:
          fx: 5333.333333333333
          fy: 5333.333333333333
          cx: 1920.0
          cy: 1080.0
          width: 3840
          height: 2160
        extrinsics:
          position_m: [-21.76280403137207, -8.857511520385742, 2.78770112991333]
          rotation_euler_deg: [91.38, -0.0, -71.51]
  - name: pose
    impl: pose
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../ilu-pose-estimation
      method: upright-tier
      min_corners: 2
  - name: instanceseg
    impl: instanceseg
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../ilu-detection
  - name: textspots
    impl: mmocr
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../mmocr
  - name: embeddings
    impl: fixture_embeddings
    inputs:
      image: load_image/image_ref
    cfg:
      source: tests/fixtures/embeddings_empty.json
  - name: associate
    impl: associate
    inputs:
      text_spots: textspots/text_spots
      pose_boxes: pose/pose_boxes
      embeddings: embeddings/embeddings
  - name: identify
    impl: identify
    inputs:
      associations: associate/associations
      text_spots: textspots/text_spots
      pose_boxes: pose/pose_boxes
    cfg:
      backend_dir: ../ilu-identification
  - name: fuse
    impl: fuse
    inputs:
      associations: associate/associations
      text_spots: textspots/text_spots
      pose_boxes: pose/pose_boxes
      embeddings: embeddings/embeddings
      image_ref: load_image/image_ref
      ilu_ids: identify/ilu_ids
