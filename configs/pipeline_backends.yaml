pipeline: backends
stages:
  - name: load_image
    impl: load_image
    cfg:
      image: ../ilu-pose-estimation/datasets/synthetic-data-generation/v3_drone_0/rgb.jpg
      camera:
        intrinsics:
          fx: 5333.333333333333
          fy: 5333.333333333333
          cx: 1920.0
          cy: 1080.0
          width: 3840
          height: 2160
        extrinsics:
          position_m: [11.898016929626465, 36.24856185913086, 16.888530731201172]
          rotation_euler_deg: [70.97, 0.0, 89.99]
  - name: pose
    impl: pose
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../ilu-pose-estimation
  - name: instanceseg
    impl: instanceseg
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../ilu-detection
  - name: textspots
    impl: mmocr
    inputs:
      image: load_image/image_ref
    cfg:
      backend_dir: ../mmocr
  - name: embeddings
    impl: fixture_embeddings
    inputs:
      image: load_image/image_ref
    cfg:
      source: tests/fixtures/embeddings_empty.json
  - name: associate
    impl: associate
    inputs:
      text_spots: textspots/text_spots
      pose_boxes: pose/pose_boxes
      embeddings: embeddings/embeddings
  - name: fuse
    impl: fuse
    inputs:
      associations: associate/associations
      text_spots: textspots/text_spots
      pose_boxes: pose/pose_boxes
      embeddings: embeddings/embeddings
      image_ref: load_image/image_ref
