[project]
name = "ilu-localization"
version = "0.1.0"
description = "DAG orchestrator and domain logic for drone-based ILU localization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "opencv-python-headless>=5.0.0.93",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "orchestrator", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
